[project]
name = "jev-study"
version = "0.1.0"
description = "Estudo técnico do Jev (TypeSafe System One) contra um baseline de saída estruturada."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
]

[project.scripts]
jev-study = "jev_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["jev_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
